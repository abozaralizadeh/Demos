services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: demos
      POSTGRES_PASSWORD: demos_dev
      POSTGRES_DB: demos
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/dev/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro

volumes:
  pgdata:
