<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Demos test page</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='16' r='9' fill='%23F5F5F3' fill-opacity='.55'/%3E%3Ccircle cx='20' cy='16' r='9' fill='%23F5F5F3' fill-opacity='.55'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600&family=DM+Mono&display=swap">
<style>
  :root { --ground: #000; --ink: #F5F5F3; --ink-2: #A3A3A0; --line: #2a2a28; --agree: #7BEBAE; --divided: #FF5A3C; }
  body.white { --ground: #F5F5F3; --ink: #0B0B0A; --ink-2: #5C5C59; --line: #DCDCD8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: "Bricolage Grotesque", system-ui, sans-serif;
    min-height: 100vh; display: flex; flex-direction: column;
    transition: background-color .6s, color .6s;
  }
  header, main, form { width: min(720px, 100%); margin: 0 auto; padding: 0 20px; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 20px; }
  .mark { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 20px; }
  .mark svg { width: 28px; height: 20px; }
  .tag { font: 12px/1 "DM Mono", monospace; border: 1px solid var(--line); padding: 6px 8px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .08em; }
  main { flex: 1; padding-top: 48px; padding-bottom: 32px; }
  .who { font: 12px "DM Mono", monospace; color: var(--ink-2); text-transform: uppercase; letter-spacing: .12em; margin: 0 0 14px; }
  .line { font-size: clamp(30px, 6vw, 48px); line-height: 1.08; letter-spacing: -.02em; margin: 0 0 14px; }
  .you { font-size: 20px; color: var(--ink-2); margin: 36px 0 0; }
  .you::before { content: "You said: "; }
  .block { font: 14px/1.5 "DM Mono", monospace; border: 1px solid var(--line); padding: 14px 16px; margin: 18px 0; color: var(--ink); }
  .block .k { color: var(--ink-2); }
  .agree { color: var(--agree); } .disagree { color: var(--divided); }
  .notice { font: 13px/1.5 "DM Mono", monospace; color: var(--ink-2); border-left: 2px solid var(--ink-2); padding-left: 12px; margin: 24px 0 0; }
  form { display: flex; gap: 10px; padding-bottom: 24px; position: sticky; bottom: 0; background: var(--ground); padding-top: 14px; transition: background-color .6s; }
  input[type=text] { flex: 1; min-width: 0; font: inherit; font-size: 18px; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 14px 20px; }
  input[type=text]:focus { outline: none; border-color: var(--ink); }
  button { font: inherit; font-size: 16px; border-radius: 999px; padding: 14px 22px; cursor: pointer; border: 1px solid var(--ink); background: var(--ink); color: var(--ground); }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .45; cursor: default; }
  .start { display: grid; gap: 18px; justify-items: start; }
  .start p { color: var(--ink-2); font-size: 18px; line-height: 1.5; margin: 0; max-width: 46ch; }
  label { display: flex; gap: 10px; align-items: flex-start; color: var(--ink-2); font-size: 16px; line-height: 1.45; max-width: 52ch; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .tools select, .tools label { font: 12px "DM Mono", monospace; color: var(--ink-2); }
  .tools select { background: transparent; border: 1px solid var(--line); padding: 5px; color: var(--ink); }
  .error { color: var(--divided); font: 14px "DM Mono", monospace; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <div class="mark">
    <svg viewBox="0 0 28 20" aria-hidden="true"><circle cx="10" cy="10" r="9" fill="currentColor" fill-opacity=".55"/><circle cx="18" cy="10" r="9" fill="currentColor" fill-opacity=".55"/></svg>
    Demos
  </div>
  <div class="tools">
    <span class="tag" id="sample">Sample data</span>
    <select id="lang" aria-label="Language"><option value="en">EN</option><option value="it">IT</option></select>
  </div>
</header>

<main id="main" aria-live="polite">
  <div class="start" id="start">
    <p class="who">Test page · Dev sign-in</p>
    <h1 class="line">Talk to everyone at once.</h1>
    <p>This page tries the Demos backend in a browser. The numbers are sample data, and sign-in is a stand-in for the real ID check. Every visit makes a new made-up person.</p>
    <label><input type="checkbox" id="agree"> I agree that what I type here is stored and used to count views, and that an AI may read it to reword the replies.</label>
    <button id="go" disabled>Start talking</button>
    <p class="error" id="err" hidden></p>
  </div>
  <div id="talk" hidden></div>
</main>

<form id="form" hidden>
  <input type="text" id="text" maxlength="2000" autocomplete="off" placeholder="Say what's on your mind" aria-label="What you want to say">
  <button type="submit" id="send">Send</button>
</form>

<script>
(function () {
  "use strict";
  // Every URL is relative, so the page works at / and under a path like /demos/.
  var $ = function (id) { return document.getElementById(id); };
  var token = null, talkId = null, lang = "en";
  try { lang = localStorage.getItem("demos-test-lang") || (navigator.language || "").slice(0, 2) === "it" && "it" || "en"; } catch (e) {}
  $("lang").value = lang;
  $("lang").addEventListener("change", function () {
    lang = this.value;
    try { localStorage.setItem("demos-test-lang", lang); } catch (e) {}
  });

  fetch("health").then(function (r) { return r.json(); }).then(function (h) {
    $("sample").hidden = !h.sample;
  }).catch(function () {});

  $("agree").addEventListener("change", function () { $("go").disabled = !this.checked; });

  function call(path, body) {
    return fetch(path, {
      method: "POST",
      headers: Object.assign({ "content-type": "application/json" }, token ? { authorization: "Bearer " + token } : {}),
      body: JSON.stringify(body || {})
    }).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (data) {
        if (!r.ok) throw new Error(typeof data.detail === "string" ? data.detail : "Something went wrong (" + r.status + ").");
        return data;
      });
    });
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function show(reply, said) {
    var box = $("talk");
    box.textContent = "";
    document.body.classList.toggle("white", reply.theme === "white");
    if (said) box.appendChild(el("p", "you", said));
    box.appendChild(el("p", "who", reply.theme === "white" ? "The other side" : "The World"));
    (reply.lines || []).forEach(function (l) { box.appendChild(el("p", "line", l)); });
    if (reply.mirror && reply.mirror.rows && reply.mirror.rows.length) {
      var m = el("div", "block");
      reply.mirror.rows.forEach(function (row) {
        var p = el("div");
        if (row.word) p.appendChild(el("span", row.value === "agree" ? "agree" : row.value === "disagree" ? "disagree" : "k", row.word + " "));
        p.appendChild(document.createTextNode(row.claim));
        m.appendChild(p);
      });
      box.appendChild(m);
    }
    if (reply.data) {
      var d = el("div", "block");
      if (reply.data.title) d.appendChild(el("div", "k", reply.data.title));
      (reply.data.items || []).forEach(function (it) { d.appendChild(el("div", null, it.label + ": " + it.value)); });
      if (reply.data.bar != null) d.appendChild(el("div", null, reply.data.bar + "% on the other side"));
      if (reply.data.base != null) d.appendChild(el("div", "k", "Out of " + reply.data.base + " people"));
      if (reply.data.source) d.appendChild(el("div", "k", "Source: " + reply.data.source + (reply.data.placeholder ? " (placeholder)" : "")));
      box.appendChild(d);
    }
    if (reply.bridge) box.appendChild(el("div", "block", reply.bridge));
    if (reply.foot) box.appendChild(el("p", "who", reply.foot));
    if (reply.source) box.appendChild(el("p", "who", reply.source));
    if (reply.notice) box.appendChild(el("p", "notice", reply.notice));
    if (reply.ended) {
      var again = el("button", "ghost", "Talk again");
      again.type = "button";
      again.addEventListener("click", begin);
      box.appendChild(again);
      $("form").hidden = true;
    } else {
      $("form").hidden = false;
      $("text").focus();
    }
  }

  function fail(e) {
    var err = $("err");
    if ($("start").hidden) {
      var box = $("talk");
      box.appendChild(el("p", "notice", e.message));
    } else {
      err.textContent = e.message; err.hidden = false;
    }
    $("send").disabled = false; $("go").disabled = !$("agree").checked;
  }

  function begin() {
    document.body.classList.remove("white");
    return call("v1/talk", { opened_by: "person" }).then(function (r) { talkId = r.conversation_id; show(r); });
  }

  $("go").addEventListener("click", function () {
    $("go").disabled = true; $("err").hidden = true; $("lang").disabled = true;
    call("v1/dev/sign-in", { language: lang })
      .then(function (r) { token = r.token; return call("v1/consent"); })
      .then(function () { $("start").hidden = true; $("talk").hidden = false; return begin(); })
      .catch(fail);
  });

  $("form").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var text = $("text").value.trim();
    if (!text || !talkId) return;
    $("send").disabled = true;
    call("v1/talk/" + talkId + "/say", { text: text })
      .then(function (r) { $("text").value = ""; $("send").disabled = false; show(r, text); })
      .catch(fail);
  });
})();
</script>
</body>
</html>
