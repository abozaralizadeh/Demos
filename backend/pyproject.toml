[project]
name = "demos"
version = "0.1.0"
description = "Backend for Demos"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic>=1.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["demos"]

[tool.pytest.ini_options]
testpaths = ["tests"]
